name: OpenClaw Integration Tests

# Triggers:
# - pull_request opened/sync/reopened on main  → test dev (gate before merge)
# - pull_request closed+merged on main          → test prod (smoke after deploy)
# - workflow_run: fires after Terraform Dev completes successfully on a PR to dev.
# - workflow_dispatch: manual run with environment choice.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_run:
    workflows: ["Terraform Dev"]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        type: choice
        options: [dev, prod]
        default: dev

# Minimal permissions: only read repo contents. Secrets are passed explicitly via env.
permissions:
  contents: read

jobs:
  # ── DEV: gate before merge ────────────────────────────────────────────────────
  test-dev:
    runs-on: ubuntu-latest
    environment: dev
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.action != 'closed') ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.environment == '' || github.event.inputs.environment == 'dev')) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.name == 'Terraform Dev' &&
       github.event.workflow_run.conclusion == 'success')
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      TF_VAR_project: ${{ vars.TF_VAR_PROJECT }}
      TF_VAR_environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_repository.full_name || github.repository }}
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Azure Login
        shell: bash
        run: |
          set -euo pipefail
          az login --service-principal \
            --username "$AZURE_CLIENT_ID" \
            --password "$AZURE_CLIENT_SECRET" \
            --tenant "$AZURE_TENANT_ID" \
            --output none
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"

      - name: Ensure AKS cluster is running
        shell: bash
        run: |
          set -euo pipefail
          CLUSTER="${TF_VAR_project}-${TF_VAR_environment}-aks"
          RG="${TF_VAR_project}-${TF_VAR_environment}-rg"
          STATE="$(az aks show --resource-group "$RG" --name "$CLUSTER" \
            --query "powerState.code" -o tsv)"
          echo "Cluster power state: $STATE"
          if [[ "$STATE" == "Stopped" ]]; then
            echo "Starting cluster $CLUSTER..."
            az aks start --resource-group "$RG" --name "$CLUSTER"
            echo "Cluster started."
          fi

      - name: Configure kubectl
        shell: bash
        run: |
          set -euo pipefail
          az aks get-credentials \
            --resource-group "${TF_VAR_project}-${TF_VAR_environment}-rg" \
            --name "${TF_VAR_project}-${TF_VAR_environment}-aks" \
            --overwrite-existing

      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq

      - name: Run integration tests
        run: bash scripts/test-openclaw.sh dev

  # ── PROD: smoke test after merge ──────────────────────────────────────────────
  test-prod:
    name: Test Prod
    runs-on: ubuntu-latest
    environment: prod
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.action == 'closed' &&
       github.event.pull_request.merged == true) ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.environment == 'prod')
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      TF_VAR_project: ${{ vars.TF_VAR_PROJECT }}
      TF_VAR_environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        shell: bash
        run: |
          set -euo pipefail
          az login --service-principal \
            --username "$AZURE_CLIENT_ID" \
            --password "$AZURE_CLIENT_SECRET" \
            --tenant "$AZURE_TENANT_ID" \
            --output none
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"

      - name: Configure kubectl
        shell: bash
        run: |
          set -euo pipefail
          az aks get-credentials \
            --resource-group "${TF_VAR_project}-${TF_VAR_environment}-rg" \
            --name "${TF_VAR_project}-${TF_VAR_environment}-aks" \
            --overwrite-existing

      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq

      - name: Run integration tests
        run: bash scripts/test-openclaw.sh prod
